name: Deploy perfiles-api

# Despliega la API al VPS por SSH en cada push a main.
# El servidor corre la API con systemd (servicio: perfiles-api) en el puerto 5000.
#
# El deploy va detrás de las pruebas: entre un commit y el VPS no hay revisión
# ni entorno de pruebas, así que la suite de humo es la única red debajo. Si
# falla, el servidor ni se toca y sigue sirviendo la versión anterior.
#
# Requiere 3 secrets en el repo (Settings -> Secrets and variables -> Actions):
#   DEPLOY_HOST     -> IP del servidor (13.140.138.144)
#   DEPLOY_USER     -> usuario de deploy (deploy)
#   DEPLOY_SSH_KEY  -> llave privada SSH cuyo .pub está en authorized_keys de deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-perfiles-api
  cancel-in-progress: false

jobs:
  pruebas:
    name: Pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22 es el mínimo que declara "engines", y lo impone better-sqlite3:
      # en Node 20 instala un binario incompatible y el proceso muere con
      # segfault, sin mensaje que lo explique.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Levanta la API con una base SQLite en memoria y recorre el flujo
      # completo. No necesita red, secrets ni base en disco.
      - name: npm test
        run: npm test

  deploy:
    name: Deploy via SSH
    needs: pruebas
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd /var/www/perfiles-api
            echo "==> git pull"
            git pull --ff-only origin main
            echo "==> npm ci"
            npm ci --omit=dev
            echo "==> restart service"
            sudo /usr/bin/systemctl restart perfiles-api
            sleep 2
            systemctl is-active perfiles-api
            echo "==> deploy OK"
